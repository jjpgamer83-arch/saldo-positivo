    <script>
      (function() {
        // 1. Fix: Cannot set property fetch of #<Window> which has only a getter
        try {
          var _origFetch = window.fetch;
          var _currentFetch = _origFetch ? _origFetch.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _currentFetch; },
            set: function(val) { _currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (_) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var _protoFetch = window.fetch ? window.fetch.bind(window) : undefined;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return _protoFetch; },
                set: function(val) { _protoFetch = val; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (__) {}
        }

        // 2. Intercept DataConnect 404 un-deployed connector console.error
        try {
          var _origConsoleError = console.error;
          console.error = function() {
            try {
              var args = Array.prototype.slice.call(arguments);
              var str = '';
              for (var i = 0; i < args.length; i++) {
                var it = args[i];
                if (typeof it === 'string') {
                  str += ' ' + it;
                } else if (it && typeof it === 'object') {
                  try {
                    str += ' ' + (it.message || JSON.stringify(it));
                  } catch (_) {
                    str += ' ' + String(it);
                  }
                } else {
                  str += ' ' + String(it);
                }
              }
              if (str.indexOf('connectors/default') !== -1 && (str.indexOf('404') !== -1 || str.indexOf('NOT_FOUND') !== -1)) {
                console.warn.apply(console, ['[DataConnect Info]:'].concat(args));
                return;
              }
            } catch (_) {}
            _origConsoleError.apply(console, arguments);
          };
        } catch (_) {}
      })();
    </script>

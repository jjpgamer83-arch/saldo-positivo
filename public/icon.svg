<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#09291e"/>
      <stop offset="55%" stop-color="#05140e"/>
      <stop offset="100%" stop-color="#020504"/>
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fundo Sólido para Android Maskable (sem borda cinza) -->
  <rect width="512" height="512" fill="url(#bgGlow)"/>

  <!-- Halo de Luz Esmeralda -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.18" filter="url(#softGlow)"/>

  <!-- Bolso / Carteira Base (Design do MeuBolso) -->
  <rect x="136" y="176" width="240" height="180" rx="36" fill="#041f15" stroke="url(#brandGrad)" stroke-width="8" opacity="0.85"/>
  <path d="M136 210 Q256 250 376 210" fill="none" stroke="url(#brandGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Moeda Central Emergindo -->
  <circle cx="256" cy="180" r="46" fill="url(#coinGrad)" filter="url(#softGlow)"/>
  <circle cx="256" cy="180" r="38" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.5"/>

  <!-- Monograma 'M' Estilizado em Vetor -->
  <path d="M166 310 L166 226 L226 276 L256 250 L286 276 L346 226 L346 310" 
        fill="none" 
        stroke="url(#brandGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Detalhe do Fecho do Bolso -->
  <circle cx="256" cy="300" r="7" fill="#6ee7b7"/>
</svg>
